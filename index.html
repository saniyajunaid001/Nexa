<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXA - AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F3F4F6;
            --white: #FFFFFF;
            --navy: #0A192F;
            --charcoal: #374151;
            --gray-100: #F3F4F6;
            --gray-200: #E5E7EB;
            --gray-300: #D1D5DB;
            --gray-400: #9CA3AF;
            --gray-500: #6B7280;
            --gray-900: #111827;
            --accent-blue: #2563EB;
            --accent-indigo: #4F46E5;
            --accent-amber: #D97706;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Glassmorphism Header */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 64px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .header-content {
            width: 100%;
            max-width: 1200px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: black;
            color: white;
            display: grid;
            place-items: center;
            border-radius: 8px;
            font-weight: 900;
            font-size: 18px;
            font-style: italic;
        }

        .logo-text {
            font-weight: 900;
            letter-spacing: 0.2em;
            color: var(--gray-900);
            font-size: 18px;
        }

        .header-avatar {
            width: 32px;
            height: 32px;
            background: var(--gray-200);
            border-radius: 50%;
            border: 1px solid var(--gray-300);
        }

        /* Layout Container */
        main {
            flex: 1;
            width: 100%;
            max-width: 896px; /* 4xl */
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            position: relative;
            margin-top: 64px;
        }

        /* Chat History Area */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 48px 32px;
            display: flex;
            flex-direction: column;
            gap: 32px;
            padding-bottom: 120px;
            scrollbar-width: none;
        }

        #chat-container::-webkit-scrollbar {
            display: none;
        }

        /* Welcome Screen */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 40px 0;
            animation: fadeIn 0.8s ease-out;
        }

        .welcome-title {
            font-size: 36px;
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 40px;
            letter-spacing: -0.02em;
        }

        .suggestion-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            width: 100%;
        }

        .card {
            background: var(--white);
            padding: 24px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--gray-200);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            gap: 16px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
        }

        .card.story:hover { border-color: #60A5FA; }
        .card.code:hover { border-color: #818CF8; }
        .card.science:hover { border-color: #FBBF24; }

        .card-icon-box {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            transition: all 0.3s ease;
        }

        .card.story .card-icon-box { background: #EFF6FF; color: #2563EB; }
        .card.code .card-icon-box { background: #EEF2FF; color: #4F46E5; }
        .card.science .card-icon-box { background: #FFFBEB; color: #D97706; }

        .card:hover .card-icon-box {
            background: currentColor;
            color: white !important;
        }

        .card-title {
            font-weight: 700;
            color: var(--gray-900);
            font-size: 16px;
        }

        .card-desc {
            font-size: 14px;
            color: var(--gray-500);
            line-height: 1.4;
        }

        /* Message Bubbles */
        .message {
            display: flex;
            width: 100%;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 80%;
            padding: 12px 20px;
            font-size: 14px;
            line-height: 1.6;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .user .bubble {
            background: var(--navy);
            color: var(--white);
            border-radius: 20px 20px 0 20px;
        }

        .ai {
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }

        .ai-avatar {
            width: 32px;
            height: 32px;
            background: var(--white);
            border-radius: 8px;
            display: grid;
            place-items: center;
            font-size: 10px;
            font-weight: 900;
            color: var(--gray-900);
            flex-shrink: 0;
            border: 1px solid var(--gray-200);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .ai .bubble {
            color: var(--gray-900);
            background: transparent;
            padding: 0;
            box-shadow: none;
            max-width: 100%;
        }

        /* Thinking Indicator */
        .thinking-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--gray-400);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.15em;
            margin-top: 4px;
        }

        .dots {
            display: flex;
            gap: 4px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--gray-400);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        /* Floating Input Bar */
        .footer-wrapper {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            padding: 0 32px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            pointer-events: none;
        }

        .input-bar {
            width: 100%;
            max-width: 672px;
            height: 56px;
            background: var(--white);
            border-radius: 28px;
            padding: 0 8px 0 24px;
            display: flex;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--gray-200);
            transition: all 0.3s ease;
            pointer-events: all;
        }

        .input-bar:focus-within {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
            ring: 4px solid rgba(37, 99, 235, 0.1);
            border-color: #60A5FA;
        }

        input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
            color: var(--gray-900);
            background: transparent;
        }

        input::placeholder {
            color: var(--gray-400);
        }

        .send-btn {
            width: 40px;
            height: 40px;
            background: var(--gray-900);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.3s ease;
            color: white;
        }

        .send-btn:hover {
            background: var(--accent-blue);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 800px) {
            .header-content { padding: 0 20px; }
            #chat-container { padding: 24px 20px; }
            .suggestion-cards { grid-template-columns: 1fr; gap: 16px; }
            .welcome-title { font-size: 28px; }
            .footer-wrapper { padding: 0 20px; bottom: 20px; height: auto; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="logo-container">
                <div class="logo-icon">X</div>
                <div class="logo-text">NEXA</div>
            </div>
            <div class="header-avatar"></div>
        </div>
    </header>

    <main>
        <div id="chat-container">
            <!-- Welcome Screen -->
            <div class="welcome-screen" id="welcome-screen">
                <h1 class="welcome-title">How can Nexa help you today?</h1>
                <div class="suggestion-cards">
                    <div class="card story" onclick="handleSuggestion('Write a story about a brave astronaut')">
                        <div class="card-icon-box">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                        </div>
                        <div>
                            <div class="card-title">Write a Story</div>
                            <p class="card-desc">Create compelling narratives or creative scripts.</p>
                        </div>
                    </div>
                    <div class="card code" onclick="handleSuggestion('Analyze this JavaScript code for performance')">
                        <div class="card-icon-box">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                        </div>
                        <div>
                            <div class="card-title">Analyze Code</div>
                            <p class="card-desc">Debug scripts, refactor logic, or explain functions.</p>
                        </div>
                    </div>
                    <div class="card science" onclick="handleSuggestion('Explain the concept of quantum entanglement')">
                        <div class="card-icon-box">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        </div>
                        <div>
                            <div class="card-title">Explain Science</div>
                            <p class="card-desc">Simplify complex concepts into easy insights.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer-wrapper">
            <form id="chat-form" class="input-bar">
                <input type="text" id="user-input" placeholder="Ask Nexa anything..." autocomplete="off">
                <button type="submit" id="send-btn" class="send-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                </button>
            </form>
        </div>
    </main>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const welcomeScreen = document.getElementById('welcome-screen');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // Scroll to bottom
        function scrollToBottom() {
            chatContainer.scrollTo({
                top: chatContainer.scrollHeight,
                behavior: 'smooth'
            });
        }

        // Handle Suggestion Clicks
        function handleSuggestion(text) {
            userInput.value = text;
            handleSubmit();
        }

        // Form Submit
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            handleSubmit();
        });

        function handleSubmit() {
            const text = userInput.value.trim();
            if (!text) return;

            // Remove welcome screen if present
            if (welcomeScreen && welcomeScreen.parentElement) {
                welcomeScreen.remove();
            }

            // Append User Message
            appendMessage('user', text);
            userInput.value = '';

            // Simulate Thinking
            const thinkingId = appendThinking();
            scrollToBottom();

            // Simulate AI Response
            setTimeout(() => {
                removeThinking(thinkingId);
                const response = getMockResponse(text);
                appendMessage('ai', response);
                scrollToBottom();
            }, 1800);
        }

        function appendMessage(role, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            
            if (role === 'ai') {
                msgDiv.innerHTML = `
                    <div class="ai-avatar">AI</div>
                    <div class="bubble">${text}</div>
                `;
            } else {
                msgDiv.innerHTML = `<div class="bubble">${text}</div>`;
            }
            
            chatContainer.appendChild(msgDiv);
        }

        function appendThinking() {
            const id = 'thinking-' + Date.now();
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ai thinking-msg';
            msgDiv.id = id;
            msgDiv.innerHTML = `
                <div class="ai-avatar">AI</div>
                <div class="bubble">
                    <div class="thinking-indicator">
                        <div class="dots">
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                        </div>
                        <span>NEXA IS THINKING</span>
                    </div>
                </div>
            `;
            chatContainer.appendChild(msgDiv);
            return id;
        }

        function removeThinking(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function getMockResponse(input) {
            const lowers = input.toLowerCase();
            if (lowers.includes('story')) return "In the quiet expanse of the lunar colony, Commander Elara gazed at Earth with a heavy heart. The mission was dangerous, but the potential to save millions outweighed the fear. As the engines roared to life, she knew this wasn't just a flight—it was a legacy...";
            if (lowers.includes('code')) return "Refactoring complete. I noticed the performance bottleneck in your nested loops; I've implemented a Hash Map approach that reduces complexity from O(n²) to O(n). This should significantly reduce execution time during high-load scenarios.";
            if (lowers.includes('science')) return "At the quantum scale, particles can become 'entangled,' meaning their states are linked inherently. Einstein famously called this 'spooky action at a distance.' Measurement of one particle's spin immediately determines the spin of its entangled partner, no matter the distance.";
            return "That's an insightful perspective. I've processed the context of your request and can help you further refine these ideas. Would you like to explore technical details or focus on the conceptual overview first?";
        }
    </script>
</body>
</html>
</body>
</html>
